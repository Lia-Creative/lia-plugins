name: skills

# The guards run before the merge, not after it. LIAB-959: a placeholder that
# Claude Code accepted and Cowork refused reached main with nothing in between
# saying so. `release` is in the push list as insurance: promotion is a
# fast-forward of commits main already ran CI on, so a red push to release
# means someone promoted something that never went through a PR.
on:
  pull_request:
  push:
    branches: [main, release]
  # By hand, from any branch carrying this file. Exists because GitHub has
  # been watched dropping pull_request runs entirely (26 Aug 2026, PRs #13 and
  # #14 — event delivered, no run created): when that happens, this is the only
  # way to get the guards a real run on the exact head.
  workflow_dispatch:

# Only ever checks out and runs node.
permissions:
  contents: read

jobs:
  frontmatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The guard proves it can go red before it is trusted to say green.
      - run: node scripts/check-skill-frontmatter.mjs --self-test
      - run: node scripts/check-skill-frontmatter.mjs

  # Machines only receive an update when the plugin's version field changes
  # (LIAB-986), so a lia-tools change without a bump is a promotion that
  # delivers to nobody. Not on push: a landed merge has no base to compare
  # against. On dispatch the base falls back to origin/main — every PR here
  # targets the trunk.
  version-bump:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The check diffs against the PR's base branch, so it needs history.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Same rule as the frontmatter guard: red first, then trusted.
      - run: node scripts/check-version-bump.mjs --self-test
      - run: node scripts/check-version-bump.mjs --base "origin/${{ github.base_ref || 'main' }}"

  # LIAB-1005: both jobs above passed a directory under lia-tools/skills/ with
  # no SKILL.md — one walks *for* SKILL.md files, the other counts changed
  # paths, so neither could see it, and 468 lines that install and cannot be
  # invoked went through. Runs on every event, like the frontmatter job: it
  # reads the tree as it stands and needs no base ref.
  roster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Same rule as the other two: red first, then trusted.
      - run: node scripts/check-skill-roster.mjs --self-test
      - run: node scripts/check-skill-roster.mjs
